name: Python regression tests
on:
  push:
    branches:
      - fix/vrsrc-review-2026-11-24
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sources
        run: python -m compileall -q app.py vrsrc_runtime.py vrsrc_source.py tests contributions
      - name: Web app and provider contract
        run: python -m unittest discover -s tests -v
      - name: Contribution pipeline
        run: python -m unittest discover -s contributions -v
